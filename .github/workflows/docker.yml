name: Docker smoke test

on:
  push:
  pull_request:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f app/Dockerfile -t subscription-ml:ci .

      - name: Run prediction smoke test
        run: docker run --rm subscription-ml:ci